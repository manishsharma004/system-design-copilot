
<!doctype html>
<html lang="en" data-theme="copilot">
  <head>
    <meta charset="utf-8" />
    <script>
      try {
        var savedTheme = localStorage.getItem('system-design-copilot-theme-v1');
        if (savedTheme) document.documentElement.dataset.theme = savedTheme;
      } catch (e) {}
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#232333" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Complete system design prep material with mobile-friendly navigation, diagrams, and case studies." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
